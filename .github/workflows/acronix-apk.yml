name: Acronix Launcher - APK de prueba

on:
  workflow_dispatch:
  push:
    branches:
      - acronix-v0.1
      - acronix-v0.2
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/acronix-apk.yml'

concurrency:
  group: acronix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Compilar APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Android SDK 37 y Build Tools 36.1
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager no encontrado en el runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.1.0' --channel=3
          # API 37 se distribuye como android-37.0; algunas herramientas
          # buscan la ruta clasica android-37.
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK de prueba
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verificar servicios sensibles excluidos del APK de pruebas
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.1.0/aapt"
          "$AAPT" dump badging "$APK" | grep -E '^package:|^application-label:'
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > merged-manifest.txt
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE' merged-manifest.txt; then
            echo "::error::El APK de pruebas sigue declarando servicios sensibles"
            exit 1
          fi
          echo "Verificado: el APK no declara servicios de accesibilidad ni listener de notificaciones."

      - name: Guardar APK para descargar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Acronix-Launcher-v0.2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
