name: Acronix - verificacion de PR

on:
  pull_request:
    branches: [acronix-v0.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acronix-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar SDK y herramientas
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.1.0' --channel=3
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Verificar comprobador de candidatas
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Ejecutar pruebas unitarias y compilar variante estandar
        run: bash gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace --no-daemon
      - name: Resumir resultados unitarios sin datos de los casos
        if: always()
        run: python3 scripts/summarize_tests.py --root app/build/test-results/testDebugUnitTest --output app/build/acronix-reports/unit-summary.json
      - name: Conservar recuentos unitarios sanitizados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-counts
          path: app/build/acronix-reports/unit-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Verificar manifiesto de la variante estandar
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump xmltree app/build/outputs/apk/debug/app-debug.apk AndroidManifest.xml > /tmp/acronix-manifest.txt
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE' /tmp/acronix-manifest.txt; then
            echo "::error::La variante estandar declara servicios sensibles"
            exit 1
          fi

  android-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar SDK y herramientas
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.1.0' --channel=3
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Habilitar aceleracion del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Ejecutar pruebas instrumentadas Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash scripts/check_android.sh
      - name: Conservar recuentos sanitizados de instrumentacion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-counts
          path: app/build/acronix-reports/instrumentation-summary.json
          if-no-files-found: warn
          retention-days: 14
