name: Acronix - Vista previa firmada por propietario (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acronix-owner-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  owner-signed-preview:
    if: github.ref == 'refs/heads/acronix-auditoria-desarrollo'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' 'build-tools;36.1.0' --channel=3
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Preparar keystore privado del propietario
        shell: bash
        env:
          PRIVATE_KEYSTORE_B64: ${{ secrets.ACRONIX_KEYSTORE_BASE64 }}
          ACRONIX_KEYSTORE_PASSWORD: ${{ secrets.ACRONIX_KEYSTORE_PASSWORD }}
          ACRONIX_KEY_ALIAS: ${{ secrets.ACRONIX_KEY_ALIAS }}
          ACRONIX_KEY_PASSWORD: ${{ secrets.ACRONIX_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$PRIVATE_KEYSTORE_B64" ] || [ -z "$ACRONIX_KEYSTORE_PASSWORD" ] ||
             [ -z "$ACRONIX_KEY_ALIAS" ] || [ -z "$ACRONIX_KEY_PASSWORD" ]; then
            echo "::error::El propietario debe configurar primero los cuatro secretos de firma en GitHub"
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/acronix-owner-private.p12"
          printf '%s' "$PRIVATE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          printf 'ACRONIX_KEYSTORE_FILE=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"
          printf 'ACRONIX_KEYSTORE_PASSWORD=%s\n' "$ACRONIX_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'ACRONIX_KEY_ALIAS=%s\n' "$ACRONIX_KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'ACRONIX_KEY_PASSWORD=%s\n' "$ACRONIX_KEY_PASSWORD" >> "$GITHUB_ENV"
          printf 'ACRONIX_BUILD_VERSION_CODE=%d\n' "$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Pruebas unitarias y build firmada experimental
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assemblePreviewRelease --no-daemon --stacktrace
      - name: Verificar certificado, identidad y ausencia de servicios sensibles
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/previewRelease/app-previewRelease.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/acronix-badging"
          grep -Fq "package: name='com.acronix.launcher.preview'" "$RUNNER_TEMP/acronix-badging"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/acronix-merged-manifest"
          if grep -E 'BIND_ACCESSIBILITY_SERVICE|BIND_NOTIFICATION_LISTENER_SERVICE' "$RUNNER_TEMP/acronix-merged-manifest"; then
            echo "::error::Vista previa firmada contiene servicios de privilegios especiales"
            exit 1
          fi
          sha256sum "$APK" > acronix-preview-sha256.txt
      - name: Conservar APK experimental firmada por el propietario
        uses: actions/upload-artifact@v4
        with:
          name: Acronix-owner-signed-preview-${{ github.run_number }}
          path: |
            app/build/outputs/apk/previewRelease/app-previewRelease.apk
            acronix-preview-sha256.txt
          if-no-files-found: error
          retention-days: 30
      - name: Eliminar copia efimera de la clave
        if: always()
        shell: bash
        run: |
          if [ -n "${ACRONIX_KEYSTORE_FILE:-}" ]; then
            rm -f -- "$ACRONIX_KEYSTORE_FILE"
          fi
